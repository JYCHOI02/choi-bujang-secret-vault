<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 가상 자료실</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.2;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #bfd0e5;
    }

    .notice {
      margin: 20px 0;
      padding: 16px;
      border: 1px solid #d07384;
      border-radius: 12px;
      color: #ffe3e8;
      background: #612a3544;
    }

    form {
      background: #1a2a3d;
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 24px;
      margin: 24px 0;
      display: grid;
      gap: 14px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      color: #8ad8df;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      background: #101a28;
      border: 1px solid #51667c;
      border-radius: 8px;
      padding: 12px 14px;
      color: #ecf4ff;
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: #8ad8df;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font: inherit;
      font-weight: 600;
      background: #214ecc;
      color: white;
      transition: opacity .2s;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #logout {
      background: #612a35;
      border: 1px solid #d07384;
      color: #ffe3e8;
      padding: 8px 16px;
      font-size: 14px;
    }

    #message {
      min-height: 24px;
      font-weight: 500;
      color: #ffe3e8;
      margin: 12px 0;
    }

    #login-state {
      font-size: 14px;
      color: #8ad8df;
      font-weight: 600;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
      margin-top: 24px;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
    }

    .note-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
    }

    .btn-edit {
      background: #22577a;
    }

    .btn-delete {
      background: #612a35;
      border: 1px solid #d07384;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
        <h1>가상 자료실</h1>
      </div>
      <button id="logout" hidden>로그아웃</button>
    </header>

    <p id="login-state">로그인하지 않음</p>
    <p id="message" role="status" aria-live="polite"></p>

    <!-- Supabase Auth 로그인 폼 -->
    <form id="login-form">
      <h2 style="margin: 0 0 6px 0; font-size: 20px;">로그인</h2>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="이메일을 입력하세요" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요"
        required>
      <button id="login" type="submit">로그인</button>
    </form>

    <!-- 가상 메모 추가 폼 -->
    <form id="note-form" hidden>
      <h2 style="margin: 0 0 6px 0; font-size: 20px;">가상 메모 추가</h2>
      <label for="note-title">제목</label>
      <input id="note-title" placeholder="메모 제목을 입력하세요" required>
      <label for="note-body">내용</label>
      <input id="note-body" placeholder="메모 내용을 입력하세요" required>
      <button id="add-note-btn" type="submit">메모 추가</button>
    </form>

    <div class="notice">실습용 계정으로 로그인합니다. 실제 개인정보는 입력하지 마세요.</div>
    <ul id="notes" aria-live="polite">
      <li>가상 자료를 불러오는 중입니다.</li>
    </ul>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://haeemsysekuvhtcvlrqv.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_XHShPC6mM-ARLYB6qgEjrg_wlVWyb9d';

    const loginForm = document.querySelector('#login-form');
    const noteForm = document.querySelector('#note-form');
    const logoutBtn = document.querySelector('#logout');
    const loginState = document.querySelector('#login-state');
    const message = document.querySelector('#message');
    const list = document.querySelector('#notes');

    let client = null;
    let initError = null;
    let currentSession = null;
    if (SUPABASE_PUBLISHABLE_KEY) {
      try {
        client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      } catch (err) {
        initError = err;
        message.textContent = `Supabase 클라이언트 초기화 오류: ${err.message}`;
      }
    } else {
      message.textContent = 'publishable key 설정이 필요합니다.';
    }

    function updateAuthUI(session) {
      currentSession = session;
      if (session) {
        loginState.textContent = `로그인됨 (${session.user.email})`;
        loginForm.hidden = true;
        noteForm.hidden = false;
        logoutBtn.hidden = false;
        message.textContent = '';
        loadNotes(session.access_token);
      } else {
        loginState.textContent = '로그인하지 않음';
        loginForm.hidden = false;
        noteForm.hidden = true;
        logoutBtn.hidden = true;
        loadNotes(null);
      }
    }

    // 로그인 폼 제출 처리 (공식 SDK 흐름)
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!client) {
        message.textContent = initError
          ? `Supabase 초기화 오류: ${initError.message}`
          : 'Supabase publishable key가 설정되지 않았습니다.';
        return;
      }
      const email = loginForm.email.value.trim();
      const password = loginForm.password.value;
      const submitBtn = document.querySelector('#login');
      submitBtn.disabled = true;
      message.textContent = '로그인 중...';

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          message.textContent = `로그인 실패: ${error.message}`;
        } else {
          message.textContent = '로그인 성공';
          loginForm.reset();
          updateAuthUI(data.session);
        }
      } catch (err) {
        message.textContent = `로그인 오류: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 메모 추가 폼 처리
    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentSession?.access_token) return;
      const title = document.querySelector('#note-title').value.trim();
      const body = document.querySelector('#note-body').value.trim();
      const btn = document.querySelector('#add-note-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentSession.access_token}`,
          },
          body: JSON.stringify({ title, body }),
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.details || errData.error || '메모 추가에 실패했습니다.');
        }
        document.querySelector('#note-title').value = '';
        document.querySelector('#note-body').value = '';
        await loadNotes(currentSession.access_token);
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // 메모 수정
    async function editNote(id, currentTitle, currentBody) {
      if (!currentSession?.access_token) return;
      const newTitle = prompt('수정할 제목을 입력하세요:', currentTitle);
      if (newTitle === null) return;
      const newBody = prompt('수정할 내용을 입력하세요:', currentBody);
      if (newBody === null) return;
      try {
        const res = await fetch(`/api/notes/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentSession.access_token}`,
          },
          body: JSON.stringify({ title: newTitle, body: newBody }),
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.details || errData.error || '메모 수정에 실패했습니다.');
        }
        await loadNotes(currentSession.access_token);
      } catch (err) {
        alert(err.message);
      }
    }

    // 메모 삭제
    async function deleteNote(id) {
      if (!currentSession?.access_token) return;
      if (!confirm('정말 삭제하시겠습니까?')) return;
      try {
        const res = await fetch(`/api/notes/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${currentSession.access_token}`,
          },
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.details || errData.error || '메모 삭제에 실패했습니다.');
        }
        await loadNotes(currentSession.access_token);
      } catch (err) {
        alert(err.message);
      }
    }

    // 로그아웃 처리 (공식 SDK 흐름)
    logoutBtn.addEventListener('click', async () => {
      if (!client) return;
      logoutBtn.disabled = true;
      try {
        const { error } = await client.auth.signOut();
        if (error) {
          message.textContent = `로그아웃 실패: ${error.message}`;
        } else {
          message.textContent = '로그아웃되었습니다.';
          updateAuthUI(null);
        }
      } catch (err) {
        message.textContent = `로그아웃 오류: ${err.message}`;
      } finally {
        logoutBtn.disabled = false;
      }
    });

    // 초기 세션 확인 및 상태 리스너 등록
    if (client) {
      try {
        const { data: { session } } = await client.auth.getSession();
        updateAuthUI(session);

        client.auth.onAuthStateChange((_event, session) => {
          updateAuthUI(session);
        });
      } catch (err) {
        message.textContent = `세션 확인 실패: ${err.message}`;
      }
    } else {
      updateAuthUI(null);
    }

    // 메모 목록 조회 (로그인 토큰 기반)
    async function loadNotes(token) {
      if (!token) {
        const item = document.createElement('li');
        item.textContent = '로그인 후 가상 자료를 확인할 수 있습니다.';
        list.replaceChildren(item);
        return;
      }
      try {
        const response = await fetch('/api/notes', {
          headers: {
            'Authorization': `Bearer ${token}`,
          },
          cache: 'no-store',
        });
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const resData = await response.json();
        const notes = Array.isArray(resData) ? resData : (resData.notes || []);
        list.replaceChildren(...notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.body || note.content || '';

          const actions = document.createElement('div');
          actions.className = 'note-actions';

          const editBtn = document.createElement('button');
          editBtn.textContent = '수정';
          editBtn.className = 'btn-sm btn-edit';
          editBtn.type = 'button';
          editBtn.addEventListener('click', () => editNote(note.id, note.title, note.body || note.content || ''));

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = '삭제';
          deleteBtn.className = 'btn-sm btn-delete';
          deleteBtn.type = 'button';
          deleteBtn.addEventListener('click', () => deleteNote(note.id));

          actions.append(editBtn, deleteBtn);
          item.append(title, content, actions);
          return item;
        }));
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }
  </script>
</body>

</html>
